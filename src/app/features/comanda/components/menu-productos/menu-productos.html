<div class="menu-container">
  <mat-chip-listbox
    [value]="comandaService.categoriaSeleccionada()"
    (change)="onCategoriaChange($event)"
    aria-label="Categorias de productos"
    class="categorias-bar">
    @for (cat of comandaService.categoriasDisponibles(); track cat) {
      <mat-chip-option [value]="cat">
        {{ cat === 'TODOS' ? 'Todas' : cat }}
      </mat-chip-option>
    }
  </mat-chip-listbox>

  <!-- Cuadrícula de productos filtrados -->
  <div class="productos-grid">
    @for (p of comandaService.productosFiltrados(); track p.id) {
      <div class="producto-btn" (click)="onAgregar(p)">
        <div class="media-container">
          @if (p.imagen_url) {
            <img
              [src]="obtenerUrlImagen(p.imagen_url)"
              [alt]="p.nombre"
              class="prod-img" />
          } @else {
            <div class="prod-icon-wrapper">
              <mat-icon class="prod-icon">{{ p.icono || 'restaurant' }}</mat-icon>
            </div>
          }
        </div>

        <div class="prod-info">
          <span class="prod-nombre">{{ p.nombre }}</span>
          <span class="prod-precio">${{ p.precio | number:'1.2-2' }}</span>
        </div>
      </div>
    }
  </div>
</div>
