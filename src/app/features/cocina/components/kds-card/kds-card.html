<mat-card class="kds-card" [class]="getUrgenciaClass(ticket().minutosTranscurridos)">
  <!-- Encabezado de la Comanda -->
  <mat-card-header class="kds-header">
    <div class="header-left">
      <span class="mesa-badge">{{ getOrigenLabel() }}</span>
      <span class="mesero-nombre">{{ ticket().mesero }}</span>
    </div>
    <div class="header-right">
      <mat-icon class="timer-icon">schedule</mat-icon>
      <span class="tiempo-texto">{{ ticket().minutosTranscurridos }}m</span>
    </div>
  </mat-card-header>

  <mat-card-content class="kds-body">
    <div class="items-list">
      @for (item of ticket().items; track item.id) {
        <button type="button" class="item-row" [class.completado]="item.completado"
          [attr.aria-pressed]="item.completado" [disabled]="itemsPendientes().has(item.id)"
          (click)="itemToggle.emit(item.id)">
          <span class="item-info">
            <mat-icon aria-hidden="true">{{ item.completado ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
            <span class="cantidad">{{ item.cantidad }}x</span>
            <span class="nombre">{{ item.nombre }}</span>
          </span>
          @if (item.notas) {
            <span class="nota-tag"><mat-icon>priority_high</mat-icon> {{ item.notas }}</span>
          }
        </button>
      }
    </div>
  </mat-card-content>

  <mat-card-actions class="kds-actions">
    <button
      mat-flat-button
      color="accent"
      class="btn-listo"
      (click)="ticketListo.emit()"
      [disabled]="ticket().items.length === 0 || tieneItemsPendientes()"
    >
      <mat-icon>check_circle</mat-icon>
      DESPACHAR
    </button>
  </mat-card-actions>
</mat-card>
