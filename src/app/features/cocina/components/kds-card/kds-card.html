<mat-card class="kds-card" [ngClass]="getUrgenciaClass(ticket().minutosTranscurridos)">
  <!-- Encabezado de la Comanda -->
  <mat-card-header class="kds-header">
    <div class="header-left">
      <span class="mesa-badge">Mesa {{ ticket().mesaNumero }}</span>
      <span class="mesero-nombre">{{ ticket().mesero }}</span>
    </div>
    <div class="header-right">
      <mat-icon class="timer-icon">schedule</mat-icon>
      <span class="tiempo-texto">{{ ticket().minutosTranscurridos }}m</span>
    </div>
  </mat-card-header>

  <!-- Lista de Platillos Táchables -->
  <mat-card-content class="kds-body">
    <div class="items-list">
      @for (item of ticket().items; track item.id) {
        <div
          class="item-row"
          [class.completado]="item.completado"
          (click)="toggleItem.emit(item.id)">
          <div class="item-info">
            <span class="cantidad">{{ item.cantidad }}x</span>
            <span class="nombre">{{ item.nombre }}</span>
          </div>
          @if (item.notas) {
            <div class="nota-tag">
              <mat-icon>priority_high</mat-icon> {{ item.notas }}
            </div>
          }
        </div>
      }
    </div>
  </mat-card-content>

  <!-- Botón Final: Marcar Despachado -->
  <mat-card-actions class="kds-actions">
    <button mat-flat-button color="accent" class="btn-listo" (click)="ticketListo.emit()">
      <mat-icon>check_circle</mat-icon> ¡DESPACHAR!
    </button>
  </mat-card-actions>
</mat-card>
