<!--
  Desarrollador: Luis Angel Vallejo
  Funcionalidad: Estructura HTML de la barra de navegación superior (Navbar).
  Incluye el logotipo del sistema, el indicador de estado de la red local, enlaces de navegación a módulos principales (Mesas, Cocina, Caja, Ventas), un conmutador rápido de tema y el menú desplegable del usuario.
-->

<mat-toolbar color="surface" class="navbar-borboto">
  <!-- Marca / Logo -->
  <div class="brand-zone">
    <div class="brand-icon">
      <mat-icon>restaurant</mat-icon>
    </div>
    <span class="brand-name">borboto</span>
    <span class="brand-tag">POS</span>
  </div>

  <!-- Estado Red In-House -->
  <div class="network-status" title="Conectado al servidor local">
    <span class="status-dot online"></span>
    <span class="status-text">Red Local</span>
  </div>

  <span class="spacer"></span>

  <!-- Selector de Módulo utilizando RouterLink y Atributos de Material -->
  <nav class="nav-links">
    @for (item of roleAccess.visibleNavItems(); track item.route) {
      <a mat-button [routerLink]="item.route" routerLinkActive="active" class="nav-btn">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <span class="spacer"></span>

  <!-- 🔹 BOTÓN RÁPIDO CAMBIAR TEMA (LUNA / SOL) -->
  <button
    mat-icon-button
    class="theme-toggle-btn"
    (click)="themeService.toggleTema()"
    [title]="themeService.esOscuro() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'"
  >
    <mat-icon>{{ themeService.esOscuro() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <!-- Zona de Usuario con Menú Nativo -->
  <div class="user-zone">
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
      <mat-icon class="avatar-icon">account_circle</mat-icon>
      <span class="user-name">{{ authService.usuarioActivo()?.nombre || 'Sin Usuario' }}</span>
      <mat-icon class="dropdown-icon">expand_more</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" class="minimal-menu">
      <button mat-menu-item (click)="cambiarTurno()">
        <mat-icon>sync</mat-icon>
        <span>Cambiar Turno</span>
      </button>

      <!-- Opción explícita dentro del menú desplegable -->
      <button mat-menu-item (click)="themeService.toggleTema()">
        <mat-icon>{{ themeService.esOscuro() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        <span>Modo {{ themeService.esOscuro() ? 'Claro' : 'Oscuro' }}</span>
      </button>

      @if (roleAccess.canAccessRoute('/ajustes', authService.usuarioActivo()?.rol)) {
        <button mat-menu-item routerLink="/ajustes">
          <mat-icon>settings</mat-icon>
          <span>Ajustes POS</span>
        </button>
      }

      <mat-divider></mat-divider>

      <button mat-menu-item class="logout-item" (click)="cerrarSesion()">
        <mat-icon color="warn">logout</mat-icon>
        <span>Cerrar Sesión</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
